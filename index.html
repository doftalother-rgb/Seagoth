    <header>
        <nav class="navbar">
            <a href="#" class="nav-item active" onclick="switchTab('home-page', this); return false;">
                <img src="https://cdn-icons-png.flaticon.com/512/25/25694.png" alt="" class="nav-icon">
                <span>Home</span>
            </a>

            <button type="button" class="nav-item-btn" onclick="openModal()">
                <img src="https://cdn-icons-png.flaticon.com/512/992/992651.png" alt="" class="nav-icon">
                <span>Add post</span>
            </button>

            <a href="#" class="nav-item" onclick="switchTab('community-page', this); return false;">
                <img src="https://cdn-icons-png.flaticon.com/512/681/681494.png" alt="" class="nav-icon">
                <span>Community</span>
            </a>

            <div class="profile-nav-btn" onclick="openProfileModal()">
                <img id="navUserAvatar" src="https://i.pravatar.cc/100?img=68" alt="Avatar" class="avatar-small">
                <span id="navUserDisplayName">Гость</span>
            </div>

            <div class="search-container">
                <img src="https://cdn-icons-png.flaticon.com/512/622/622669.png" alt="" class="search-icon">
                <input type="text" id="postSearchInput" placeholder="search posts...">
            </div>
        </nav>
    </header>

    <main class="content-container">
        <section id="home-page" class="page-section active">
            <h2>Лента публикаций</h2>
            <div class="posts-feed" id="postsFeed"></div>
        </section>

        <section id="community-page" class="page-section">
            <h2>Популярные сообщества (100 игр и тем)</h2>
            <div class="communities-grid" id="communitiesGrid"></div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-content">
            <p>&copy; 2026 ForumSent. Все права не защищены.</p>
            <div class="footer-links">
                <a href="#">О нас</a>
                <a href="#">Правила</a>
                <a href="#">Поддержка</a>
            </div>
        </div>
    </footer>

    <div id="postModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Создать новый пост</h3>
                <button type="button" class="close-modal-btn" onclick="closeModal()">&times;</button>
            </div>
            <form id="createPostForm" onsubmit="handleCreatePost(event)">
                <div class="form-group">
                    <label for="post-title">Заголовок</label>
                    <input type="text" id="post-title" placeholder="О чем хотите рассказать?" required>
                </div>
                <div class="form-group">
                    <label for="post-community">Выберите сообщество</label>
                    <select id="post-community"></select>
                </div>
                <div class="form-group">
                    <label for="post-text">Текст публикации</label>
                    <textarea id="post-text" rows="4" placeholder="Напишите ваш текст здесь..." required></textarea>
                </div>
                <button type="submit" class="submit-btn">Опубликовать</button>
            </form>
        </div>
    </div>

    <div id="profileModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Настройки профиля</h3>
                <button type="button" class="close-modal-btn" onclick="closeProfileModal()">&times;</button>
            </div>
            <form id="profileForm" onsubmit="handleSaveProfile(event)">
                <div class="form-group">
                    <label for="usernameInput">Юзернейм (например: @alex)</label>
                    <input type="text" id="usernameInput" placeholder="username" required>
                    <span id="usernameError" class="error-text"></span>
                </div>
                <div class="form-group">
                    <label for="displayNameInput">Отображаемое имя</label>
                    <input type="text" id="displayNameInput" placeholder="Как вас звать?" required>
                </div>
                <div class="form-group">
                    <label for="avatarFileInput">Загрузить аватарку с устройства</label>
                    <input type="file" id="avatarFileInput" accept="image/*">
                </div>
                <button type="submit" class="submit-btn">Сохранить профиль</button>
            </form>
        </div>
    </div>

    <div id="commentsModal" class="modal-overlay">
        <div class="modal-content comments-modal-content">
            <div class="modal-header">
                <h3>Комментарии</h3>
                <button type="button" class="close-modal-btn" onclick="closeCommentsModal()">&times;</button>
            </div>
            <div class="comments-list" id="commentsList"></div>
            <form id="addCommentForm" onsubmit="handleAddComment(event)" class="comment-form">
                <input type="text" id="commentInput" placeholder="Написать комментарий..." required>
                <button type="submit" class="submit-comment-btn">Отправить</button>
            </form>
        </div>
    </div>

        let currentUser = JSON.parse(localStorage.getItem('forum_user')) || {
            username: 'user_' + Math.floor(Math.random() * 1000),
            displayName: 'Новый участник',
            avatar: 'https://i.pravatar.cc/100?img=68'
        };

        let currentPostId = null;

        window.addEventListener('DOMContentLoaded', () => {
            updateProfileUI();
            renderCommunities();
            populateCommunitySelect();
            renderPosts();

            const searchInput = document.getElementById('postSearchInput');
            if (searchInput) {
                searchInput.addEventListener('input', (e) => {
                    const query = e.target.value.toLowerCase().trim();
                    renderPosts(query);
                    if (query.length > 0) {
                        switchTab('home-page', document.querySelector('.nav-item'));
                    }
                });
            }

            window.addEventListener('storage', (event) => {
                if (event.key === 'forum_posts' || event.key === 'forum_user') {
                    if (event.key === 'forum_user') {
                        currentUser = JSON.parse(event.newValue);
                        updateProfileUI();
                    }
                    if (event.key === 'forum_posts') {
                        const query = document.getElementById('postSearchInput') ? document.getElementById('postSearchInput').value.toLowerCase().trim() : '';
                        renderPosts(query);
                    }
                }
            });
        });

        function renderCommunities() {
            const grid = document.getElementById('communitiesGrid');
            grid.innerHTML = communitiesData.map(comm => `
                <div class="community-card">
                    <h3>${escapeHtml(comm.name)}</h3>
                    <p>${escapeHtml(comm.desc)}</p>
                    <span class="members-count">${comm.members} участников</span>
                    <button class="join-btn" onclick="toggleJoin(this)">Вступить</button>
                </div>
            `).join('');
        }

        function populateCommunitySelect() {
            const select = document.getElementById('post-community');
            select.innerHTML = communitiesData.map(comm => `
                <option value="${comm.name}">${comm.name}</option>
            `).join('');
        }

        function toggleJoin(btn) {
            if (btn.textContent === "Вступить") {
                btn.textContent = "Вы участник";
                btn.style.background = "#333";
                btn.style.color = "#fff";
            } else {
                btn.textContent = "Вступить";
                btn.style.background = "transparent";
                btn.style.color = "#333";
            }
        }

        function updateProfileUI() {
            document.getElementById('navUserAvatar').src = currentUser.avatar;
            document.getElementById('navUserDisplayName').textContent = currentUser.displayName;
        }

        function openProfileModal() {
            document.getElementById('usernameInput').value = currentUser.username;
            document.getElementById('displayNameInput').value = currentUser.displayName;
            document.getElementById('usernameError').textContent = '';
            document.getElementById('profileModal').style.display = 'flex';
        }

        function closeProfileModal() {
            document.getElementById('profileModal').style.display = 'none';
        }

        function handleSaveProfile(event) {
            event.preventDefault();
            const newUsername = document.getElementById('usernameInput').value.trim();
            const newDisplayName = document.getElementById('displayNameInput').value.trim();
            const fileInput = document.getElementById('avatarFileInput');
            const errorSpan = document.getElementById('usernameError');

            let takenUsernames = JSON.parse(localStorage.getItem('forum_taken_usernames')) || ['admin', 'moderator', 'root'];
            
            if (newUsername !== currentUser.username && takenUsernames.includes(newUsername)) {
                errorSpan.textContent = 'Этот юзернейм уже занят!';
                return;
            }

            takenUsernames = takenUsernames.filter(u => u !== currentUser.username);
            takenUsernames.push(newUsername);
            localStorage.setItem('forum_taken_usernames', JSON.stringify(takenUsernames));

            const saveUserData = (avatarUrl) => {
                currentUser = {
                    username: newUsername,
                    displayName: newDisplayName,
                    avatar: avatarUrl || currentUser.avatar
                };
                localStorage.setItem('forum_user', JSON.stringify(currentUser));
                updateProfileUI();
                closeProfileModal();
                renderPosts();
            };

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) { saveUserData(e.target.result); };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                saveUserData(currentUser.avatar);
            }
        }

        function switchTab(pageId, element) {
            const sections = document.querySelectorAll('.page-section');
            sections.forEach(section => section.classList.remove('active'));

            const navItems = document.querySelectorAll('.navbar > a.nav-item');
            navItems.forEach(item => item.classList.remove('active'));

            const targetSection = document.getElementById(pageId);
            if (targetSection) targetSection.classList.add('active');

            if (element && element.classList.contains('nav-item')) {
                element.classList.add('active');
            }
        }

        function openModal() { document.getElementById('postModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('postModal').style.display = 'none'; }

        function renderPosts(searchQuery = '') {
            const postsFeed = document.getElementById('postsFeed');
            let posts = JSON.parse(localStorage.getItem('forum_posts')) || [];

            const thirtyDaysMs = 30 * 24 * 60 * 60 * 1000;
            const now = Date.now();
            
            const validPosts = posts.filter(post => {
                if (!post.timestamp) return true;
                return (now - post.timestamp) < thirtyDaysMs;
            });

            if (validPosts.length !== posts.length) {
                posts = validPosts;
                localStorage.setItem('forum_posts', JSON.stringify(posts));
            }

            if (searchQuery) {
                posts = posts.filter(post => 
                    post.title.toLowerCase().includes(searchQuery) || 
                    post.text.toLowerCase().includes(searchQuery) ||
                    post.authorName.toLowerCase().includes(searchQuery) ||
                    post.authorUsername.toLowerCase().includes(searchQuery) ||
                    post.community.toLowerCase().includes(searchQuery)
                );
            }

            if (posts.length === 0) {
                postsFeed.innerHTML = '<p class="no-posts" style="color: #777; grid-column: span 2; text-align: center;">Ничего не найдено</p>';
                return;
            }

            postsFeed.innerHTML = posts.map(post => {
                const isMyPost = post.authorUsername === currentUser.username;

                return `
                    <article class="post-card" data-id="${post.id}">
                        <div class="post-header" style="display: flex; justify-content: space-between; align-items: flex-start;">
                            <div style="display: flex; gap: 10px; align-items: center;">
                                <img src="${post.authorAvatar}" alt="Avatar" class="avatar">
                                <div>
                                    <h4 class="post-author">${escapeHtml(post.authorName)} <span class="username-tag">@${escapeHtml(post.authorUsername)}</span></h4>
                                    <span class="post-time">${post.time} · ${post.community}</span>
                                </div>
                            </div>
                            ${isMyPost ? `<button type="button" onclick="deletePost('${post.id}')" style="background: transparent; border: none; color: #ff4d4d; cursor: pointer; font-size: 14px;" title="Удалить пост">🗑️ Удалить</button>` : ''}
                        </div>
                        <h3 class="post-title">${escapeHtml(post.title)}</h3>
                        <div class="post-content" id="content_${post.id}">
                            <p>${escapeHtml(post.text)}</p>
                        </div>
                        <button type="button" class="toggle-text-btn" id="btn_${post.id}" onclick="togglePostText('${post.id}')" style="display: none;">Развернуть</button>
                        <div class="post-footer">
                            <button type="button" class="action-btn like-btn ${post.isLiked ? 'liked' : ''}" onclick="toggleLike('${post.id}')">
                                <img src="likeicon.png" alt="Like" class="btn-icon">
                                <span class="like-count">${post.likes}</span>
                            </button>
                            <button type="button" class="action-btn comment-btn" onclick="openComments('${post.id}')">
                                <img src="chat.png" alt="Comments" class="btn-icon">
                                <span class="comment-count">${post.comments.length} ${getCommentWord(post.comments.length)}</span>
                            </button>
                        </div>
                    </article>
                `;
            }).join('');

            setTimeout(() => {
                posts.forEach(post => {
                    const contentDiv = document.getElementById(`content_${post.id}`);
                    const btn = document.getElementById(`btn_${post.id}`);
                    if (contentDiv && btn) {
                        if (contentDiv.scrollHeight > 120) {
                            btn.style.display = 'inline-block';
                        }
                    }
                });
            }, 0);
        }

        function togglePostText(postId) {
            const contentDiv = document.getElementById(`content_${postId}`);
            const btn = document.getElementById(`btn_${postId}`);
            if (contentDiv && btn) {
                contentDiv.classList.toggle('expanded');
                if (contentDiv.classList.contains('expanded')) {
                    btn.textContent = 'Свернуть';
                } else {
                    btn.textContent = 'Развернуть';
                }
            }
        }

        function deletePost(postId) {
            if (!confirm('Вы уверены, что хотите удалить этот пост?')) return;
            let posts = JSON.parse(localStorage.getItem('forum_posts')) || [];
            posts = posts.filter(post => post.id !== postId);
            localStorage.setItem('forum_posts', JSON.stringify(posts));
            const query = document.getElementById('postSearchInput').value.toLowerCase().trim();
            renderPosts(query);
        }

        function handleCreatePost(event) {
            event.preventDefault();
            const titleInput = document.getElementById('post-title');
            const communitySelect = document.getElementById('post-community');
            const textInput = document.getElementById('post-text');

            if (!titleInput || !textInput) return;

            const newPost = {
                id: 'post_' + Date.now(),
                authorName: currentUser.displayName,
                authorUsername: currentUser.username,
                authorAvatar: currentUser.avatar,
                community: communitySelect.value,
                title: titleInput.value,
                text: textInput.value,
                time: 'Только что',
                timestamp: Date.now(),
                likes: 0,
                isLiked: false,
                comments: []
            };

            let posts = JSON.parse(localStorage.getItem('forum_posts')) || [];
            posts.unshift(newPost);
            localStorage.setItem('forum_posts', JSON.stringify(posts));

            document.getElementById('createPostForm').reset();
            closeModal();
            
            const searchInput = document.getElementById('postSearchInput');
            if (searchInput) searchInput.value = '';
            renderPosts();
            switchTab('home-page', document.querySelector('.nav-item'));
        }

        function toggleLike(postId) {
            let posts = JSON.parse(localStorage.getItem('forum_posts')) || [];
            posts = posts.map(post => {
                if (post.id === postId) {
                    if (post.isLiked) {
                        post.likes -= 1;
                        post.isLiked = false;
                    } else {
                        post.likes += 1;
                        post.isLiked = true;
                    }
                }
                return post;
            });
            localStorage.setItem('forum_posts', JSON.stringify(posts));
            const query = document.getElementById('postSearchInput').value.toLowerCase().trim();
            renderPosts(query);
        }

        function openComments(postId) {
            currentPostId = postId;
            document.getElementById('commentsModal').style.display = 'flex';
            renderComments();
        }

        function closeCommentsModal() {
            document.getElementById('commentsModal').style.display = 'none';
            currentPostId = null;
        }

        function renderComments() {
            if (!currentPostId) return;
            const posts = JSON.parse(localStorage.getItem('forum_posts')) || [];
            const post = posts.find(p => p.id === currentPostId);
            const commentsList = document.getElementById('commentsList');

            if (!post || post.comments.length === 0) {
                commentsList.innerHTML = '<p class="no-comments">Пока нет комментариев. Будьте первыми!</p>';
                return;
            }

            commentsList.innerHTML = post.comments.map(c => `
                <div class="comment-item">
                    <strong>${escapeHtml(c.author)}</strong>
                    <p>${escapeHtml(c.text)}</p>
                </div>
            `).join('');
        }

        function handleAddComment(event) {
            event.preventDefault();
            if (!currentPostId) return;

            const input = document.getElementById('commentInput');
            const text = input.value.trim();
            if (!text) return;

            let posts = JSON.parse(localStorage.getItem('forum_posts')) || [];
            posts = posts.map(post => {
                if (post.id === currentPostId) {
                    post.comments.push({
                        author: currentUser.displayName + ' (@' + currentUser.username + ')',
                        text: text
                    });
                }
                return post;
            });

            localStorage.setItem('forum_posts', JSON.stringify(posts));
            input.value = '';
            renderComments();
            const query = document.getElementById('postSearchInput').value.toLowerCase().trim();
            renderPosts(query);
        }

        function getCommentWord(num) {
            if (num % 10 === 1 && num % 100 !== 11) return 'комментарий';
            if ([2, 3, 4].includes(num % 10) && ![12, 13, 14].includes(num % 100)) return 'комментария';
            return 'комментариев';
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
